# web layer: 挂载企业 4 个 MCP Server（streamable HTTP）
- insert:
  - id: mcp-docs
    name: '@deepseek-ai/dsh-mcp-client'
    config:
      serverName: docs
      transport: streamable-http
      url: http://127.0.0.1:8001/mcp
  - id: mcp-ops
    name: '@deepseek-ai/dsh-mcp-client'
    config:
      serverName: ops
      transport: streamable-http
      url: http://127.0.0.1:8002/mcp
  - id: mcp-security
    name: '@deepseek-ai/dsh-mcp-client'
    config:
      serverName: security
      transport: streamable-http
      url: http://127.0.0.1:8003/mcp
  - id: mcp-memory
    name: '@deepseek-ai/dsh-mcp-client'
    config:
      serverName: memory
      transport: streamable-http
      url: http://127.0.0.1:8004/mcp

# 默认会话使用 enterprise agent preset（id-targeted override 替换整个 config）
- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: enterprise

# 基准护栏：强制"先查后答"，拦截无工具直答与敷衍应答（含身份注入）
- insert:
  - id: guard
    name: guard
    config:
      retryMax: 3
      identity:
        name: 周宏伟
        department: 销售部
        level: D2
        role: manager
        employee_id: "EMP024"